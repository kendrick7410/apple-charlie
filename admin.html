<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin décor</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f3efe2; --card: #fffdf6; --ink: #4e342e; --line: #eadfc4; --ok: #8fbf7f; --okd: #6f9e60; --bad: #c62828; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--bg); color: var(--ink); font-family: 'Varela Round', sans-serif; }
        form { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 26px; width: min(360px, 100%);
               box-shadow: 0 10px 30px rgba(60,45,20,.15); }
        h1 { margin: 0 0 6px; font-size: 1.4rem; color: #5b7d4c; }
        p { margin: 0 0 16px; color: #8a7a66; }
        input { width: 100%; font: inherit; font-size: 1.1rem; padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; color: var(--ink); }
        button { margin-top: 14px; width: 100%; border: none; border-radius: 999px; background: var(--ok); color: #fff; font: inherit;
                 font-size: 1.1rem; font-weight: bold; padding: 12px; cursor: pointer; box-shadow: 0 4px 0 var(--okd); }
        #msg { margin-top: 10px; min-height: 1.2em; color: var(--bad); font-weight: bold; }
    </style>
</head>
<body>
<form id="f" autocomplete="off">
    <h1>🛠️ Admin du décor</h1>
    <p>Mot de passe pour placer les objets du village.</p>
    <input id="pw" type="password" placeholder="Mot de passe" autofocus>
    <button type="submit">Entrer</button>
    <div id="msg"></div>
</form>
<script>
document.getElementById('f').onsubmit = function(e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value, msg = document.getElementById('msg');
    msg.textContent = '';
    // Le mot de passe est vérifié par le serveur (il n'est écrit nulle part dans cette page)
    fetch('admin-api/check', { method: 'POST', headers: { 'X-Admin-Password': pw }, cache: 'no-store' }).then(function(r) {
        if (r.status === 200) {
            try { sessionStorage.setItem('village_admin', pw); } catch (err) {}
            location.href = './?admin';   // vue 3D (les vrais objets) ; lien vers la 2D dans le panneau
        } else msg.textContent = r.status === 429 ? 'Trop d\'essais, attends une minute.' : 'Mot de passe incorrect.';
    }).catch(function() { msg.textContent = 'Serveur admin injoignable.'; });
};
</script>
</body>
</html>
